[preset.0]
name="macOS"
platform="macOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/fonts/OFL.txt,THIRD_PARTY.md"
exclude_filter="docs/*,tests/*,tools/*,builds/*"
export_path="builds/Wayfarer.zip"
script_export_mode=2

[preset.0.options]
export/distribution_type=1
binary_format/architecture="universal"
application/bundle_identifier="games.orison.wayfarer"
application/short_version="1.1.0"
application/version="1.1.0"
application/category="Games"
codesign/codesign=1
codesign/identity="-"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true

[preset.1]
name="Web"
platform="Web"
runnable=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/fonts/OFL.txt,THIRD_PARTY.md"
exclude_filter="docs/*,tests/*,tools/*,builds/*"
export_path="builds/web/index.html"
script_export_mode=2

[preset.1.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
